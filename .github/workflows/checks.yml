name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, node: 22 }
          - { os: ubuntu-24.04, node: 24 }
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 22 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run test:ops
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: python scripts/build-release.py
      - run: python scripts/check-launchers.py
        if: runner.os != 'Linux'
  browser-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test-browser.py
      - run: python scripts/build-release.py
      - run: python scripts/check-launchers.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-club-demo-checks
          path: artifacts/
  hosted-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - name: PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x /usr/lib/postgresql/17/bin/initdb ]; then
            curl --fail --location https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/postgresql.asc"
            sudo install -m 0644 "$RUNNER_TEMP/postgresql.asc" /usr/share/keyrings/postgresql.asc
            printf '%s\n' 'deb [signed-by=/usr/share/keyrings/postgresql.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-17
          fi
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Download verified real Supabase Auth
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bookclub-auth"
          curl --fail --location --retry 3 https://github.com/supabase/auth/releases/download/v2.197.0/auth-v2.197.0-amd64.tar.xz -o "$RUNNER_TEMP/bookclub-auth.tar.xz"
          echo "b5c2991d1df760c9b099c1c2395a94bd1c2f83ed58901934921997179dc9f7ea  $RUNNER_TEMP/bookclub-auth.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/bookclub-auth.tar.xz" -C "$RUNNER_TEMP/bookclub-auth"
      - run: python scripts/test-postgres.py
      - run: python scripts/test-tls.py
      - run: python scripts/test-auth.py "$RUNNER_TEMP/bookclub-auth"
